# CyberPulse — OWASP ZAP scan policy
# ==================================
# Consumed by zap-baseline.py / zap-full-scan.py via `-c`.
#
# Format (tab separated):  <rule_id>	<action>
#   action: IGNORE | INFO | WARN | FAIL
#     FAIL = the scan exits non-zero and the alert is counted as a failure
#     WARN = reported, does not fail the run (we also pass -I)
#     INFO = reported as informational only
#     IGNORE = drop the alert entirely
#
# Rules not listed keep ZAP's defaults, so this file only tunes the noise that
# is expected in an HTTP-only local sandbox.
#
# Full rule catalogue: https://www.zaproxy.org/docs/alerts/
#
# ── Expected noise for a local HTTP sandbox (no TLS, no CDN) ──────────────────
10011	IGNORE	# Cookie Without Secure Flag — target is plain HTTP by design
10035	IGNORE	# Strict-Transport-Security Header Not Set — no TLS in the sandbox
10015	IGNORE	# Incomplete or No Cache-control Header Set
10096	IGNORE	# Timestamp Disclosure - Unix
10109	IGNORE	# Modern Web Application
10104	IGNORE	# User Agent Fuzzer
90022	IGNORE	# Application Error Disclosure — VulnApp intentionally leaks details
10063	IGNORE	# Permissions Policy Header Not Set

# ── Findings that matter for this project ────────────────────────────────────
# Missing anti-clickjacking / XSS / sniffing headers are real hardening gaps.
10020	WARN	# Missing Anti-clickjacking Header (X-Frame-Options)
10021	WARN	# X-Content-Type-Options Header Missing
10038	WARN	# Content Security Policy (CSP) Header Not Set
10017	WARN	# Cross-Domain JavaScript Source File Inclusion
10098	WARN	# Cross-Domain Misconfiguration

# ── Active-scan rules (only fire with --scan-type full) ───────────────────────
40018	FAIL	# SQL Injection
40019	FAIL	# SQL Injection - MySQL/SQLite
40020	FAIL	# SQL Injection - Hypersonic/Other
40021	FAIL	# SQL Injection - Oracle/PostgreSQL
40012	FAIL	# Cross Site Scripting (Reflected)
40014	FAIL	# Cross Site Scripting (Persistent)
40016	FAIL	# Cross Site Scripting (Persistent) - Prime
40017	FAIL	# Cross Site Scripting (Persistent) - Spider
90019	FAIL	# Server-side Code Injection
90020	FAIL	# Remote OS Command Injection
6	FAIL	# Path Traversal
